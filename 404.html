<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | PainRelief</title>
  <meta name="description" content="The page you are looking for could not be found. Return to PainRelief's homepage for pain management resources and appointments.">
  
  <!-- Favicon matching logo (Heart Pulse) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236E473B' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z'/><path d='M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27'/></svg>">
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#FAF6F0',
              100: '#F3ECE3',
              200: '#E2D5C7',
              300: '#C6B29F',
              400: '#A78D78',
              500: '#8A5E4F',
              600: '#6E473B',
              700: '#57372D',
              800: '#432921',
              900: '#311D17',
              950: '#1F120E',
            },
            teal: {
              50: '#FAF6F0',
              100: '#F3ECE3',
              200: '#E2D5C7',
              300: '#C6B29F',
              400: '#A78D78',
              500: '#8A5E4F',
              600: '#6E473B',
              700: '#57372D',
              800: '#432921',
              900: '#311D17',
              950: '#1F120E',
            },
            navy: {
              800: '#1e293b',
              900: '#0f172a',
              950: '#020617',
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          }
        }
      }
    };
  </script>

  <!-- Prevent Theme & RTL Flash -->
  <script>
    (function() {
      const theme = localStorage.getItem('painrelief_theme');
      if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
      const dir = localStorage.getItem('painrelief_direction') || 'ltr';
      document.documentElement.setAttribute('dir', dir);
    })();
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 font-sans antialiased transition-colors duration-200 overflow-x-hidden w-full max-w-full">

  <!-- ========== 404 MAIN CONTENT (No Nav, No Footer) ========== -->
  
  <main class="min-h-screen flex items-center justify-center px-4 sm:px-6 lg:px-8 relative overflow-hidden">
    
    <!-- Background Decorative Elements -->
    <div class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none z-0">
      <div class="absolute -top-40 -right-40 w-96 h-96 rounded-full bg-teal-100/60 dark:bg-teal-900/30 blur-3xl"></div>
      <div class="absolute bottom-0 -left-40 w-96 h-96 rounded-full bg-teal-200/40 dark:bg-teal-950/40 blur-3xl"></div>
    </div>

    <!-- Main Content Card -->
    <div class="relative z-10 max-w-2xl mx-auto text-center">
      
      <!-- Logo / Icon -->
      <div class="flex justify-center mb-8">
        <div class="w-20 h-20 rounded-3xl bg-[#6E473B] flex items-center justify-center text-white shadow-xl shadow-teal-600/25">
          <i data-lucide="heart-pulse" class="w-10 h-10"></i>
        </div>
      </div>

      <!-- Error Code -->
      <p class="text-8xl sm:text-9xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-teal-600 to-teal-400 dark:from-teal-400 dark:to-teal-200 mb-4 tracking-tighter">
        404
      </p>

      <!-- Heading -->
      <h1 class="text-3xl sm:text-4xl lg:text-5xl font-extrabold text-slate-900 dark:text-white mb-6 leading-tight">
        Oops! We couldn't find<br>that page.
      </h1>

      <!-- Subtext -->
      <p class="text-lg sm:text-xl text-slate-600 dark:text-slate-400 mb-10 max-w-lg mx-auto leading-relaxed">
        The page you are looking for may have been moved, deleted, or never existed. Let's get you back to a pain-free experience.
      </p>

      <!-- Back to Home Button -->
      <a href="index.html" class="inline-flex items-center justify-center space-x-3 px-8 py-4 rounded-2xl bg-teal-600 hover:bg-teal-700 text-white font-bold text-lg shadow-lg shadow-teal-600/30 transition transform hover:-translate-y-0.5">
        <i data-lucide="home" class="w-5 h-5"></i>
        <span>Back to Home</span>
        <i data-lucide="arrow-right" class="w-5 h-5"></i>
      </a>

      <!-- Helpful Links (Optional, keeps user on site) -->
      <div class="mt-16 pt-8 border-t border-slate-200 dark:border-slate-800">
        <p class="text-sm font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-4">Or visit one of these pages</p>
        <div class="flex flex-wrap justify-center gap-4 text-sm font-medium">
          <a href="about.html" class="text-slate-600 dark:text-slate-300 hover:text-teal-600 dark:hover:text-teal-400 transition">About Us</a>
          <span class="text-slate-300 dark:text-slate-700">•</span>
          <a href="treatments.html" class="text-slate-600 dark:text-slate-300 hover:text-teal-600 dark:hover:text-teal-400 transition">Treatments</a>
          <span class="text-slate-300 dark:text-slate-700">•</span>
          <a href="doctors.html" class="text-slate-600 dark:text-slate-300 hover:text-teal-600 dark:hover:text-teal-400 transition">Our Doctors</a>
          <span class="text-slate-300 dark:text-slate-700">•</span>
          <a href="contact.html" class="text-slate-600 dark:text-slate-300 hover:text-teal-600 dark:hover:text-teal-400 transition">Contact</a>
        </div>
      </div>

    </div>
  </main>

  <!-- Scripts -->
  <script>
    // Initialize Lucide icons
    lucide.createIcons();

    // --- Theme Toggle Logic (Disabled here, but kept for consistency if a global toggle was added) ---
    // Since there is no nav, we don't need the toggle buttons, but we respect the saved theme.
  </script>
</body>
</html>
